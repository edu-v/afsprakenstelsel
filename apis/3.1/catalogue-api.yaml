openapi: 3.1.1
info:
  title: Catalogue API
  version: 2.2.0-rc.1
  description: 'The Catalogue API is implemented by the publisher or reseller of learning materials.


    The Catalogue API is the source of Product information and provides GET endpoints to receive the latest
    state.


    Two entities are available to Consumers of the Catalogue API:

    - **Product**: the full set of attributes including metadata, media, licensing, pricing, and payment
    information, especially useful for the `Overkoepelende leermiddelencatalogus`, `Selectieomgeving leermiddelen`,
    and `Bestelomgeving leermiddelen`.

    - **ProductInfo**: a smaller subset of attributes focused on displaying the product within a portal,
    especially useful for the `Leermiddelenportaal` and `Onderwijsleeromgeving`


    In a future version the Notifications API can be used to notify Consumers of the Catalogue API whenever
    a Product changes (new, update or delete).'
  contact:
    name: Edu-V
    url: www.edu-v.org/afsprakenstelsel
    email: info@edu-v.org
  x-afkorting: CAT
  x-status: release-candidate
  x-beheer: Werkgroep Verwerven en in gebruik nemen
  x-ingangsdatum: '2027-01-14'
  x-gegevensdienst: Leermiddelen
  x-bron:
  - Leveranciersspecifieke leermiddelencatalogus
  x-afnemers:
  - Overkoepelende leermiddelencatalogus
  - Selectieomgeving leermiddelen
  - Bestelomgeving leermiddelen
  - Aanspraakmanager
  - Leermiddelenportaal
  - Onderwijsleeromgeving
  - Leermiddelendashboard
components:
  schemas:
    schemaVersion:
      description: 'Schema version of this API using semantic versioning 2.0.0.

        The API version number is communicated in the header.

        The major version is communicated in the URI.

        For more information see the [Edu-V versioning guidelines](https://edu-v.atlassian.net/wiki/spaces/AFSPRAKENS/pages/9437200/Versiebeheer).

        '
      type: string
      default: 2.2.0-rc.1
    Product:
      title: Product
      description: A product that is available for selection within a `Bestelomgeving leermiddelen`, `Selectieomgeving
        leermiddelen`, and `Overkoepelende leermiddelencatalogus`. This entity captures all information
        needed for presentation, selection and optionally sale.
      type: object
      x-tags:
      - Product
      x-toelichting: Een product dat beschikbaar is voor selectie binnen een Bestelomgeving leermiddelen,
        Selectieomgeving leermiddelen en Overkoepelende leermiddelencatalogus. Dit object bevat alle informatie
        voor presentatie, selectie en optioneel verkoop.
      properties:
        productId:
          $ref: '#/components/schemas/ProductID'
          description: The unique identifier for this product. For all products that are forSale an EAN
            or ISBN number is provided. For all other Products a uuid is generated by the provider of
            the product.
          x-vullingsregel: 'Voor verkoopbare producten: ISBN of EAN. Voor overige producten: uuid. Waarde
            mag niet wijzigen.'
        publisher:
          type: string
          description: 'Name of the organisation supplying and providing the product: the `Leermiddelenaanbieder`.'
        reseller:
          type: string
          description: 'Name of the organisation reselling the product: the `Leermiddelenverkoper`.

            This field is only mandatory when this Catalogue API is provided by the reseller.

            '
          x-vullingsregel: Verplicht zodra de Catalogue API wordt aangeboden door een Leermiddelenverkoper.
        type:
          type: string
          description: Type of product. In case the product consists of both physical and digital products,
            the value combi is chosen.
          enum:
          - physical
          - digital
          - combi
          x-vullingsregel: Waarde combi bij combi-product (fysiek + digitaal). Waarde physical/digital
            bij enkel fysiek/digitaal. Waarde mag niet wijzigen.
        status:
          type: string
          description: Lifecycle status of the product.
          enum:
          - not-yet-available
          - limited-available
          - available
          - temporary-not-available
          - no-longer-available
          - will-never-be-available
          - not-available-or-usable
          x-vullingsregel: Conform levenscyclus van Leermiddel, zie pagina Producten, Aanspraken en Licenties.
        forSale:
          type: boolean
          description: 'True if the product is forSale.

            False if the product is not for sale (e.g. for Demo products or Digital products that are
            only sold as a Combi or Set)

            '
          x-vullingsregel: False zodra het product niet te verkopen is (bijv. demo-producten). Waarde
            mag niet wijzigen.
        saleUnitSize:
          type: integer
          description: 'The number of units within this product.

            For example this value is 5 for a set of five physical books.

            '
          minimum: 1
          x-vullingsregel: Waarde >= 1
        isConsumptionProduct:
          type: boolean
          description: 'True if the product is `verbruiksmateriaal`.

            '
          x-vullingsregel: 'Voor digitaal materiaal met licentie voor bepaalde tijd: True. Voor onbepaalde
            tijd: False.'
        name:
          type: string
          description: Name of the Product
        productFamilyName:
          type: string
          description: Name of the Product Family this Product belongs to.
          x-vullingsregel: Verplicht voor alle leermiddelen die onderdeel zijn van een methode-familie.
        edition:
          type: string
          description: 'The issue (In Dutch: nummer) and version (In Dutch: Druk) of the product.'
          example: Nr + Druk
          x-vullingsregel: 'Formaat: Nr + "Druk". Kan ook versie, schooljaar of verschijningsjaar zijn.'
        productUsages:
          type: array
          description: 'The intended product usage.

            Values are in Dutch for backwards compatibility. This field is on the Edu-V backlog and will
            be revised and completed in a future version.

            '
          items:
            type: string
            enum:
            - leerboek
            - werkboek
            - leerwerkboek
            - examenbundel
            - oefenmateriaal
            - naslagwerk
            - docentenmateriaal
            - toets
            - examen
            - anders
          x-vullingsregel: Waardelijst overgenomen uit ECK DT CatalogService, uitgebreid met docentenmateriaal/toets/examen.
        intendedEndUserRole:
          type: string
          description: 'The intended end users of the product, being one of:

            - student

            - educator (e.g. teachers, coaches or assistants)

            - administrator

            '
          enum:
          - student
          - educator
          - administrator
          x-vullingsregel: student sluit educator niet uit; educator sluit student wel uit; administrator
            is gericht op beheerders.
        courseReferences:
          type: array
          description: Reference to this products course detailed description
          items:
            $ref: '#/components/schemas/CourseReference'
          x-vullingsregel: Blijft leeg voor een set van digitale leermiddelen. Verwijzingen mogen niet
            wijzigen (foutcorrecties uitgezonderd).
        studies:
          type: array
          description: The studies and study years that this product is targeted at.
          items:
            $ref: '#/components/schemas/Study'
          x-vullingsregel: Vullen conform de waardelijst afspraken voor opleidingen, opleidingsjaren en
            niveaus.
        subjects:
          type: array
          description: The subjects that this product is targeted at.
          items:
            $ref: '#/components/schemas/Subject'
          x-vullingsregel: Vullen conform de waardelijst afspraken voor vakken.
        price:
          type: array
          description: 'Public List price of the Product. It is possible to include historic and future
            prices for a product (e.g. for Indexation).

            When applicable, include the historic price (t-1), the current price (t) and the future price
            (t+1).

            '
          items:
            type: object
            properties:
              priceExcl:
                type: number
                description: Price excluding VAT and rounded to 2 decimals
                x-vullingsregel: Verplicht veld
              priceIncl:
                type: number
                description: Price including VAT and rounded to 2 decimals
                x-vullingsregel: Verplicht veld
              vatRate:
                type: string
                description: 'The VAT rate that applies to this price.

                  - high: the high VAT rate applies.

                  - low: the low VAT rate applies.

                  - none: no VAT applies.

                  '
                enum:
                - high
                - low
                - none
              priceCurrency:
                type: string
                description: 'The applicable currency according to ISO4217 currency codes, see: https://en.wikipedia.org/wiki/ISO_4217.'
                pattern: '[A-Z]{3}$'
                default: EUR
                x-vullingsregel: Conform ISO 4217 currency codes
              validFrom:
                type: string
                description: 'The date (incl.) from which this price is valid, format: YYYY-MM-DD (according
                  to RFC3339)'
                format: date
                x-vullingsregel: Verplicht veld
              priceType:
                type: string
                description: The type of pricing for this product.
                enum:
                - standard
                - tier
                - schoolSize
                default: standard
                x-vullingsregel: standard is standaard
              schoolSizePricing:
                type: array
                description: Array of schoolSizePrice objects. Only applicable when priceType is `schoolSize`.
                items:
                  $ref: '#/components/schemas/SchoolSizePrice'
                x-vullingsregel: Zie object SchoolSizePrice
              tierPricing:
                type: array
                description: Array of tierPrice objects. Only applicable when priceType is `tier`.
                items:
                  $ref: '#/components/schemas/TierPrice'
                x-vullingsregel: Zie object TierPrice
            required:
            - priceExcl
            - priceIncl
            - priceCurrency
            - validFrom
            x-toelichting: Het betreft de publieke prijsstelling voor het product. Om prijswijzigingen
              (bijvoorbeeld indexatie) mogelijk te maken kunnen meerdere prijsstellingen gedeeld worden.
              Werkingsregel is om, indien van toepassing, de vorige prijs (t-1), de actuele prijs (t)
              en, indien bekend, de toekomstige prijs (t+1) te delen.
          x-vullingsregel: Verplicht bij forSale = true.
        paymentModels:
          type: array
          description: The payment models applicable to this Product.
          items:
            type: string
            enum:
            - pre-paid
            - post-paid
            - periodically-paid
          x-vullingsregel: Verplicht als het product te verkopen is (forSale = true).
        licensePeriod:
          type: object
          description: Duration of the license period. Mandatory field for digital products
          properties:
            licenseVariant:
              type: string
              description: 'The variant of the the license period.


                - days: the expirationDate is set a specified number of days after the firstUsed (initial
                activation) date.

                - month: the expirationDate is set a month after the firstUsed (initial activation) date.

                - year: the expirationDate is set a year after the firstUsed (initial activation) date.

                - schoolyear: the expirationDate is set at 31st of July after the firstUsed (initial activation)
                date.

                '
              enum:
              - days
              - month
              - year
              - schoolyear
              x-vullingsregel: 'Verplicht veld. Indien month: expirationDate 1 maand na firstUsed-datum.
                Indien year: expirationDate 1 jaar na firstUsed-datum. Indien schoolyear: expirationDate
                op de eerstvolgende 31 juli na firstUsed-datum.'
            licenseDays:
              type: integer
              description: Number of days. Mandatory field for licenseVariant `days`.
              x-vullingsregel: Verplicht als licenseVariant `days` is gekozen.
          required:
          - licenseVariant
          x-toelichting: Duur van de licentieperiode op het product. Verplicht veld voor digitale producten.
          if:
            properties:
              licenseVariant:
                const: days
          then:
            required:
            - licenseDays
          x-vullingsregel: Verplicht als het een digitaal product is (type != physical).
        activationPeriod:
          type: object
          description: Prescribes the way the activationUntilDate can be calculated.
          properties:
            activationVariant:
              type: string
              description: 'The variant that should be applied to calculate the ActivationUntilDate.


                - days: number of days after the startDate of the activation period. Value activationDays
                is a mandatory field.

                - date: fixed activationDate for every entitlement. Value activationUntilDate is a mandatory
                field.

                - schoolyear: the activationUntilDate is set at 31st of July after the startDate.

                '
              enum:
              - days
              - date
              - schoolyear
              x-vullingsregel: 'Verplicht veld. Indien schoolyear: activationUntilDate op de eerstvolgende
                31 juli na de startDate.'
            activationDays:
              type: integer
              description: Number of days. Mandatory field for activationDays `days`.
              x-vullingsregel: Verplicht als activationVariant `days` is gekozen.
            activationUntilDate:
              type: string
              description: 'A fixed activationUntilDate for all entitlements, format: YYYY-MM-DD (according
                to RFC3339)'
              format: date
              x-vullingsregel: Verplicht als activationVariant `date` is gekozen.
          required:
          - activationVariant
          x-toelichting: Beschrijft de wijze waarop de Leermiddelenshop de activationUntilDate kan berekenen.
            Verplicht veld voor digitale producten.
          x-vullingsregel: Verplicht als het een digitaal product is (type != physical).
          allOf:
          - if:
              properties:
                activationVariant:
                  const: days
            then:
              required:
              - activationDays
          - if:
              properties:
                activationVariant:
                  const: date
            then:
              required:
              - activationUntilDate
        deliveryTypes:
          type: array
          description: The delivery variant available for this product.
          items:
            type: string
            enum:
            - school-all
            - school-admin
            - school-studies
            - school-subjects
            - school-groups
            - school-students
            - school-employees
            - school-activationcodes
            - customer-student
            - customer-activationcode
          x-vullingsregel: 'Verplicht als het een digitaal product is. [LET OP: Confluence O/V-kolom toont
            "O", niet "O*" -- tegenstrijdig met de eigen vullingsregeltekst. Niet als if/then afgedwongen,
            alleen gedocumenteerd; verifieer met bron.]'
        infoLink:
          type: string
          description: URL to the information about the product. Contains the same value as `infoLink`
            in ProductInfo for the same productId.
        trialAccessUrl:
          type: string
          description: Optional trial / preview URL.
        defaultAccessUrl:
          type: string
          description: 'The default Access Url used to access the product after selection or purchase.

            Mandatory field for combi and digital products.

            For sets of digital products and combi products a single Access URl is listed from which all
            underlying digital products can be activated.

            '
          x-vullingsregel: Verplicht om in te vullen als het type product digital of combi is. Voor combiproducten
            en sets van digitale leermiddelen wordt een overkoepelende toegangslink opgenomen van waaruit
            alle onderliggende digitale leermiddelen in gebruik zijn te nemen.
        specificAccessUrls:
          type: array
          description: 'list of fields where specific access links can be specified.

            '
          items:
            type: object
            properties:
              accessUrl:
                type: string
                description: The URL of the access link.
                x-vullingsregel: Verplicht veld.
              accessUrlType:
                type: string
                description: The type URL of the access link in accessUrl.
                enum:
                - OIDC
                - BP
                - ENTREE
                x-vullingsregel: Verplicht veld.
            required:
            - accessUrl
            - accessUrlType
        shortDescription:
          type: string
          description: Short description for display on search pages or other marketing blocks.
          minLength: 1
          maxLength: 80
          x-vullingsregel: Veld is gevuld en heeft tussen de 1 en 80 karakters.
        longDescription:
          type: string
          description: Long description for display on a product page.
        copyrightType:
          type: string
          description: 'Indicator if copyright is applicable to the Product.

            The Creative Commons licenses are specified according to the [CreativeCommons version 4.0
            specification](https://purl.edustandaard.nl/copyrightsandotherrestrictions_nllom_20131202).''

            In case, another type of copyright is applicable to the product, the value `yes` is used.

            If no copyright is applicable to the product, the value `no` is used.

            '
          enum:
          - cc-by-40
          - cc-by-sa-40
          - cc-by-nc-40
          - cc-by-nc-sa-40
          - cc-by-nd-40
          - cc-by-nc-nd-40
          - cc-by-30
          - cc-by-sa-30
          - cc-by-nc-30
          - cc-by-nc-sa-30
          - cc-by-nd-30
          - cc-by-nc-nd-30
          - 'yes'
          - 'no'
          x-vullingsregel: 'Vulling volgens CreativeCommons v4.0 NL LOM voorschrift. "yes": er zitten
            auteursrechten op die niet gelijk zijn aan een Creative Commons licentie. "no": geen auteursrechten
            van toepassing.'
        authors:
          type: object
          properties:
            individuals:
              type: array
              items:
                type: object
                properties:
                  givenName:
                    type: string
                  familyName:
                    type: string
                  familyNamePrefix:
                    type: string
                required:
                - givenName
                - familyName
            organisations:
              type: array
              items:
                type: string
                description: The name of the organisation.
          x-vullingsregel: ''
        media:
          type: object
          description: A collection of media for use in product pages.
          properties:
            publisherThumbnailUrl:
              $ref: '#/components/schemas/Media'
              description: The logo of the publisher to show in a thumbnail.
            mainThumbnailUrl:
              $ref: '#/components/schemas/Media'
              description: The main media item to show in a thumbnail.
            resellerThumbnailUrl:
              $ref: '#/components/schemas/Media'
              description: 'The logo of the reseller to show in a thumbnail.

                This field is only mandatory when this Catalogue API is provided by the reseller.

                '
            productImageUrls:
              type: array
              description: A collection of image urls for a product.
              items:
                $ref: '#/components/schemas/Media'
            productVideoUrls:
              type: array
              description: A collection of video urls for a product.
              items:
                $ref: '#/components/schemas/Media'
            productDocUrls:
              type: array
              description: A collection of document urls for a product.
              items:
                $ref: '#/components/schemas/Media'
          required:
          - publisherThumbnailUrl
        followUpProduct:
          $ref: '#/components/schemas/ProductID'
          description: productId of the product that succeeds this product.
        relatedProducts:
          type: array
          description: An array of related product IDs (for display alongside the product within a product
            page).
          items:
            $ref: '#/components/schemas/ProductID'
            description: productIds of the related products.
        bundledProducts:
          type: array
          description: 'In case this product is a combi product or set, all underlying products can be
            included and referred in this attribute.

            This field is mandatory for sets of digital products.

            This field is optional (but recommended) for combi products and sets of physical products.

            '
          items:
            $ref: '#/components/schemas/ProductID'
            description: productIds of the products in the set or in the combi product.
          x-vullingsregel: 'Verplicht om in te vullen als het product een Setbeschrijving van digitale
            leermiddelen betreft. Advies is om ook voor combiproduct de bundledProducts te vullen met
            onderliggende producten. [OPEN PUNT: geen veld in het schema onderscheidt een "Set" van een
            regulier "combi"-product -- deze regel kan niet als if/then worden afgedwongen zonder een
            nieuw onderscheidend veld.]'
        physicalInfo:
          type: object
          description: Physical characteristics of the product for fulfillment parties, e.g. to determine
            the shipping box and for return checks. Mandatory field for products of type `physical`. Not
            used for products of type `digital` and `combi`; the physical parts of a combi product are
            available as separate products via `bundledProducts`.
          properties:
            numberOfPages:
              type: integer
              description: Exact number of pages.
              minimum: 1
            dimensions:
              type: object
              description: 'Dimensions of the product in millimetres, aligned with ONIX Measure (codelist
                48), see: https://ns.editeur.org/onix/en/48.'
              properties:
                height:
                  type: integer
                  description: Height in mm.
                  minimum: 1
                width:
                  type: integer
                  description: Width in mm.
                  minimum: 1
                thickness:
                  type: integer
                  description: Thickness in mm.
                  minimum: 1
              required:
              - height
              - width
              - thickness
            weight:
              type: integer
              description: Weight in grams.
              minimum: 1
            productForm:
              type: string
              description: 'Product form (including binding) of the product. Values according to ONIX
                codelist 150 Product form, e.g. BB (hardback), BC (paperback / softback), BE (spiral bound),
                see: https://ns.editeur.org/onix/en/150.'
              pattern: ^[A-Z0-9]{2}$
              example: BC
            productFormDetail:
              type: array
              description: 'Additional detail on the product form, e.g. the binding. Values according to
                ONIX codelist 175 Product form detail, e.g. B304 (sewn), B305 (adhesive bound), B310 (saddle-sewn),
                see: https://ns.editeur.org/onix/en/175.'
              items:
                type: string
                pattern: ^[A-Z][0-9]{3}$
                example: B305
          required:
          - dimensions
          - weight
          - productForm
          x-vullingsregel: Verplicht bij type physical.
        firstPublishedDate:
          type: string
          description: 'Date the product will be or is published on the market, format: YYYY-MM-DD (according
            to RFC3339)'
          format: date
          x-vullingsregel: Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties).
        availableFromDate:
          type: string
          description: 'Expected date from which the product is (again) available for delivery, e.g. after
            a temporary supply interruption or reprint. For a combi product this is the date from which
            all parts are available. This date is indicative and not related to a specific order, format:
            YYYY-MM-DD (according to RFC3339)'
          format: date
        deprecationDate:
          type: string
          description: 'Date when a follow-up product is available on the market, format: YYYY-MM-DD (according
            to RFC3339)'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: niet als if/then gemodelleerd,
            afhankelijk van externe levenscyclus-statusmatrix.]'
        supportedUntilDate:
          type: string
          description: 'Date after which the product can no longer be ordered or sold, format: YYYY-MM-DD
            (according to RFC3339). Mandatory field for the status: `no-longer-available` and `not-available-or-usable`.'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: zie deprecationDate.]'
        endOfLifeDate:
          type: string
          description: 'Date after which the product is no longer available, format: YYYY-MM-DD (according
            to RFC3339). Mandatory field for the status: `no-longer-available` and `not-available-or-usable`.'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: zie deprecationDate.]'
        isYearBound:
          type: boolean
          description: 'True if the product is intended for a specific school year and is replaced annually
            (e.g. exam trainers).

            The applicable school year is derived from the life cycle fields (firstPublishedDate, deprecationDate,
            supportedUntilDate, endOfLifeDate).

            '
        dateCreated:
          type: string
          description: 'Indicates the date and time the object was first created. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2017-07-21T17:32:28Z'
        dateLastModified:
          type: string
          description: 'Indicates the date and time the object was last modified. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2022-08-11T15:31:12Z'
      required:
      - productId
      - publisher
      - type
      - status
      - forSale
      - saleUnitSize
      - name
      - studies
      - edition
      - subjects
      - shortDescription
      - copyrightType
      - media
      - firstPublishedDate
      - dateCreated
      - dateLastModified
      allOf:
      - if:
          properties:
            forSale:
              const: true
        then:
          required:
          - price
          - paymentModels
      - if:
          not:
            properties:
              type:
                const: physical
        then:
          required:
          - licensePeriod
          - activationPeriod
      - if:
          properties:
            type:
              const: physical
        then:
          required:
          - physicalInfo
    ProductInfo:
      title: ProductInfo
      description: Product info for the `Leermiddelenportaal` and `Onderwijsleeromgeving`. This entity
        includes name, product lifecycle status and dates, media information, studies and subject metadata
        and the AccessUrl.
      type: object
      x-tags:
      - Product
      x-toelichting: Product info for the `Leermiddelenportaal` and `Onderwijsleeromgeving`. This entity
        includes name, product lifecycle status and dates, media information, studies and subject metadata
        and the AccessUrl.
      properties:
        productId:
          $ref: '#/components/schemas/ProductID'
          description: The unique identifier for this product. For all products that are forSale an EAN
            or ISBN number is provided. For all other Products a uuid is generated by the provider of
            the product.
          x-vullingsregel: 'Voor verkoopbare producten: ISBN of EAN. Voor overige producten: uuid. Waarde
            mag niet wijzigen.'
        publisher:
          type: string
          description: 'Name of the organisation supplying and providing the product: the `Leermiddelenaanbieder`.'
        type:
          type: string
          description: Type of product. In case the product consists of both physical and digital products,
            the value combi is chosen. Products of type physical are not included in ProductInfo.
          enum:
          - digital
          - combi
          x-vullingsregel: Waarde combi bij combi-product (fysiek + digitaal). Waarde digital bij enkel
            digitaal. Fysieke producten vallen buiten ProductInfo. Waarde mag niet wijzigen.
        status:
          type: string
          description: Lifecycle status of the product.
          enum:
          - not-yet-available
          - limited-available
          - available
          - temporary-not-available
          - no-longer-available
          - will-never-be-available
          - not-available-or-usable
          x-vullingsregel: Conform levenscyclus van Leermiddel, zie pagina Producten, Aanspraken en Licenties.
        name:
          type: string
          description: Name of the Product
        productFamilyName:
          type: string
          description: Name of the Product Family this Product belongs to. Required if the product is
            part of a method family.
        courseReferences:
          type: array
          description: Reference to this products course detailed description
          items:
            $ref: '#/components/schemas/CourseReference'
          x-vullingsregel: Blijft leeg voor een set van digitale leermiddelen. Verwijzingen mogen niet
            wijzigen (foutcorrecties uitgezonderd).
        studies:
          type: array
          description: The studies and study years that this product is targeted at.
          items:
            $ref: '#/components/schemas/Study'
          x-vullingsregel: Vullen conform de waardelijst afspraken voor opleidingen, opleidingsjaren en
            niveaus.
        subjects:
          type: array
          description: The subjects that this product is targeted at.
          items:
            $ref: '#/components/schemas/Subject'
          x-vullingsregel: Vullen conform de waardelijst afspraken voor vakken.
        infoLink:
          type: string
          description: URL to the information about the product. Contains the same value as `infoLink`
            in Product for the same productId.
        trialAccessUrl:
          type: string
          description: Optional trial / preview URL.
        defaultAccessUrl:
          type: string
          description: 'The default Access Url used to access the product after selection or purchase.

            Mandatory field for combi and digital products.

            For sets of digital products and combi products a single Access URl is listed from which all
            underlying digital products can be activated.

            '
          x-vullingsregel: In dit object onvoorwaardelijk verplicht (in tegenstelling tot Product.defaultAccessUrl,
            dat alleen verplicht is voor digital/combi) -- stelt het Leermiddelenportaal in staat een
            toegangslink te tonen aan de eindgebruiker.
        specificAccessUrls:
          type: array
          description: 'list of fields where specific access links can be specified.

            '
          items:
            type: object
            properties:
              accessUrl:
                type: string
                description: The URL of the access link.
                x-vullingsregel: Verplicht veld.
              accessUrlType:
                type: string
                description: The type URL of the access link in accessUrl.
                enum:
                - OIDC
                - BP
                - ENTREE
                x-vullingsregel: Verplicht veld.
            required:
            - accessUrl
            - accessUrlType
        shortDescription:
          type: string
          description: Short description for display on search pages or other marketing blocks.
        longDescription:
          type: string
          description: Long description for display on a product page.
        media:
          type: object
          description: A collection of media for use in product pages.
          properties:
            publisherThumbnailUrl:
              $ref: '#/components/schemas/Media'
              description: The logo of the publisher to show in a thumbnail.
            mainThumbnailUrl:
              $ref: '#/components/schemas/Media'
              description: The main media item to show in a thumbnail.
          required:
          - publisherThumbnailUrl
          - mainThumbnailUrl
        bundledProducts:
          type: array
          description: "In case this product is a combi product or set, all underlying products can be\
            \ included and referred in this attribute.  \nThis field is mandatory for sets of digital\
            \ products.  \nThis field is optional (but recommended) for combi products and sets of physical\
            \ products.\n"
          items:
            $ref: '#/components/schemas/ProductID'
            description: productIds of the products in the set or in the combi product.
          x-vullingsregel: 'Verplicht om in te vullen als het product een Setbeschrijving van digitale
            leermiddelen betreft. Advies is om ook voor combiproduct de bundledProducts te vullen met
            onderliggende producten. [OPEN PUNT: geen veld in het schema onderscheidt een "Set" van een
            regulier "combi"-product -- deze regel kan niet als if/then worden afgedwongen zonder een
            nieuw onderscheidend veld.]'
        firstPublishedDate:
          type: string
          description: 'Date the product will be or is published on the market, format: YYYY-MM-DD (according
            to RFC3339)'
          format: date
          x-vullingsregel: Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties).
        deprecationDate:
          type: string
          description: 'Date when a follow-up product is available on the market, format: YYYY-MM-DD (according
            to RFC3339)'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: niet als if/then gemodelleerd,
            afhankelijk van externe levenscyclus-statusmatrix.]'
        supportedUntilDate:
          type: string
          description: 'Date after which the product can no longer be ordered or sold, format: YYYY-MM-DD
            (according to RFC3339). Mandatory field for the status: `no-longer-available` and `not-available-or-usable`.'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: zie deprecationDate.]'
        endOfLifeDate:
          type: string
          description: 'Date after which the product is no longer available, format: YYYY-MM-DD (according
            to RFC3339). Mandatory field for the status: `no-longer-available` and `not-available-or-usable`.'
          format: date
          x-vullingsregel: 'Conform vullingsregels data passend bij status uit levenscyclus van Leermiddel
            (zie pagina Producten, Aanspraken en Licenties). [OPEN PUNT: zie deprecationDate.]'
        dateCreated:
          type: string
          description: 'Indicates the date and time the object was first created. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2017-07-21T17:32:28Z'
        dateLastModified:
          type: string
          description: 'Indicates the date and time the object was last modified. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2022-08-11T15:31:12Z'
      required:
      - productId
      - publisher
      - type
      - status
      - name
      - studies
      - subjects
      - defaultAccessUrl
      - shortDescription
      - media
      - firstPublishedDate
      - dateCreated
      - dateLastModified
    CourseReference:
      title: CourseReference
      description: 'A reference to the content of the products.

        The details of the content can be retrieved via the Course API.

        A product gives access to one or more courses. A course can be referenced by one or more Products.'
      type: object
      x-tags:
      - Product
      properties:
        courseId:
          type: string
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        title:
          type: string
        description:
          type: string
    Study:
      title: Study
      description: A study where this product is targeted at.
      type: object
      properties:
        studyName:
          type: string
          description: 'Official name of the study.

            - primary education: the `po-opleidingseenheden in RIO korte naam` name as specified in [Waardenlijsten
            RIO-po, schooljaar 2026-2027](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/)
            is used.

            - secondary education: the `korte naam` as specified in [Waardenlijst Opleidingen en opleidingsgroepen
            vo, schooljaar 2026-2027, v1.01](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/),
            tab `Opleidingseenheden (volledig)`, is used.

            - vocational education: the `kwalificatienaam` as specified in [Register kwalificatiestructuur
            SBB](https://kwalificatie-mijn.s-bb.nl) is used.

            '
          x-vullingsregel: 'PO: erkende opleiding conform Waardenlijsten RIO-po 2026-2027. VO: korte naam
            conform Waardenlijst Opleidingen en opleidingsgroepen vo 2026-2027 v1.01, tabblad Opleidingseenheden
            (volledig). MBO: kwalificatienaam conform Register kwalificatiestructuur SBB.'
        studyCode:
          type: string
          description: 'Official code of the study.

            - primary education: the `opleidingseenheidcode` as specified in [Waardenlijsten RIO-po, schooljaar
            2026-2027](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/) is
            used.

            - secondary education: the `opleidingseenheidcode` (O-code, format 9999O9999, e.g. 1002O2254)
            as specified in [Waardenlijst Opleidingen en opleidingsgroepen vo, schooljaar 2026-2027, v1.01](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/),
            tab `Opleidingseenheden (volledig)`, column A, is used.

            - vocational education: the `crebocode` as specified in [Register kwalificatiestructuur SBB](https://kwalificatie-mijn.s-bb.nl)
            is used.

            '
          x-vullingsregel: 'PO: opleidingseenheidcode conform Waardenlijsten RIO-po 2026-2027. VO: opleidingseenheidcode
            (O-code) conform Waardenlijst Opleidingen en opleidingsgroepen vo 2026-2027 v1.01, tabblad Opleidingseenheden
            (volledig), kolom A. MBO: crebocode conform Register kwalificatiestructuur SBB.'
        studyLevels:
          type: array
          description: 'Official levels of the study.

            Primary and secondary education studyLevels are based on the `Niveau` as specified in [SLO
            curriculum 2026](https://opendata.slo.nl/curriculum/2026/api/v1/niveau/)

            For Vocational Education Edu-V extended this list as documented on [Waardelijst onderwijsniveaus
            en leerjaren](https://edu-v.atlassian.net/wiki/spaces/AFSPRAKENS/pages/179470347/Waardelijst+onderwijsniveaus+en+leerjaren).

            '
          items:
            type: object
            properties:
              studyLevelId:
                type: string
                description: The uuid of the level.
                pattern: ^[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}$
                example: cb61531d-61eb-4412-a52f-ca065ca37e39/
              studyLevelPrefix:
                type: string
                description: The prefix of the level
                pattern: ^[0-9]*$
                minLength: 4
                maxLength: 4
                example: 4205
              studyLevelName:
                type: string
                description: The name of the level.
                example: havo 5
            required:
            - studyLevelId
            - studyLevelPrefix
            - studyLevelName
      required:
      - studyName
    Subject:
      title: Subject
      description: A subject where this product is targeted at.
      type: object
      x-tags:
      - Product
      properties:
        subjectPrefix:
          type: string
          description: 'Prefix of the subject, for primary and secondary education: the `Prefix` as specified
            in [Waardenlijst Vakken en leergebieden po en vo, schooljaar 2026-2027, v1.01](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/),
            tab `Leermiddelenketen`, column C.

            Some prefixes are used for more than one subject; a subject is always identified by subjectPrefix
            and subjectName.

            '
          x-vullingsregel: Prefix (kolom C) conform Waardenlijst Vakken en leergebieden po en vo 2026-2027
            v1.01, tabblad Leermiddelenketen (PO/VO). Een vak altijd identificeren met prefix en naam.
        subjectName:
          type: string
          description: 'Name of the subject, for primary and secondary education: the `Vaknaam` as specified
            in [Waardenlijst Vakken en leergebieden po en vo, schooljaar 2026-2027, v1.01](https://www.edustandaard.nl/standaard_werkgroepen/beheergroep-waardenlijsten-rio/),
            tab `Leermiddelenketen`, column B.

            '
          x-vullingsregel: Vaknaam (kolom B) conform Waardenlijst Vakken en leergebieden po en vo 2026-2027
            v1.01, tabblad Leermiddelenketen (PO/VO).
      required:
      - subjectName
      - subjectPrefix
    SchoolSizePrice:
      type: object
      properties:
        qty:
          type: integer
          description: Minimum number of students from which this price applies.
        priceExcl:
          type: number
          description: Price excluding VAT.
          format: float
        priceIncl:
          type: number
          description: Price including VAT.
          format: float
    TierPrice:
      type: object
      properties:
        qty:
          type: integer
          description: Minimum number of copies from which this price applies.
        priceExcl:
          type: number
          description: Price excluding VAT.
          format: float
        priceIncl:
          type: number
          description: Price including VAT.
          format: float
    Media:
      title: Media
      description: A reference to a media object.
      type: object
      x-tags:
      - Product
      properties:
        url:
          type: string
          description: url to the media object.
          x-voorbeeld: ''
        description:
          type: string
          description: short description of the media object, which can be displayed as hover info.
        width:
          type: integer
          description: width in pixels
        height:
          type: integer
          description: height in pixels
      required:
      - url
    ProductID:
      title: ProductID
      x-tags:
      - Product
      anyOf:
      - type: string
        description: uuid
        pattern: ^[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}$
        example: 3b951e8f-de9e-4d0a-be3e-0caea2467ec8
      - type: string
        description: isbn
        pattern: ^[0-9]{13}$
        example: '9789402054958'
      - type: string
        description: ean
        pattern: ^[0-9]{13}$
        example: '4003994155486'
    StatusResponse:
      title: StatusResponse
      description: Functional status code and status message.
      type: object
      properties:
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nCatalogue API (30xx):\n  * `3001` - Product unknown: De identifier van\
            \ het Product is onbekend.\n"
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
      required:
      - status
  responses:
    BadRequest:
      description: 'Bad Request - schema validation failed, unsupported schemaVersion, or unknown school
        (status 0011 / 0012 / 0023).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Unauthorized:
      description: 'Unauthorized - the supplier is not authorised for the requested scope (status 0021).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Forbidden:
      description: 'Forbidden - the information object is classification IV and the gegevensdienst has
        not been activated (status 0022).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    NotFound:
      description: 'Not Found - the endpoint URL is not known.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    MethodNotAllowed:
      description: 'Method Not Allowed - the request method is not permitted for this endpoint.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    ServerError:
      description: 'Internal Server Error - general server-side error.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/oauth2/token
          refreshUrl: https://api.example.com/oauth2/token
          scopes:
            eduv.catalogue: scope that allows a party to retrieve products from the catalogue
paths:
  /products:
    parameters:
    - schema:
        type: string
        format: date-time
      in: query
      name: since
      required: false
      description: "Request all products modified after the specified timestamp. Format: Conform openapi\
        \ in ZULU time as specified in RFC 3339, section 5.6.  \nClients are encouraged to use the since\
        \ parameter above fetching the resource fully.  \n**Maximum age of the timestamp is 7 days in\
        \ the past.**\n"
      example: '2017-07-21T17:32:28Z'
    get:
      summary: Get All Products
      operationId: get-all-products
      x-tags:
      - Product
      tags:
      - Leveranciersspecifieke leermiddelencatalogus
      description: Get all products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.catalogue
  /products/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
    get:
      x-eduv-error-codes:
      - '3001'
      summary: Get Product by ID
      operationId: get-product-by-id
      x-tags:
      - Product
      tags:
      - Leveranciersspecifieke leermiddelencatalogus
      description: Get a specific product by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.catalogue
  /products/info:
    parameters:
    - schema:
        type: string
        format: date-time
      in: query
      name: since
      required: false
      description: "Request all products modified after the specified timestamp. Format: Conform openapi\
        \ in ZULU time as specified in RFC 3339, section 5.6.  \nClients are encouraged to use the since\
        \ parameter above fetching the resource fully.  \n**Maximum age of the timestamp is 7 days in\
        \ the past.**\n"
      example: '2017-07-21T17:32:28Z'
    get:
      summary: Get All Products Info for Display In Portal
      operationId: get-all-products-info
      x-tags:
      - Product
      tags:
      - Leveranciersspecifieke leermiddelencatalogus
      description: Get the product info of all products of type digital and combi. Products of type
        physical are not included.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.catalogue
  /products/info/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
    get:
      x-eduv-error-codes:
      - '3001'
      summary: Get Product Info by ID for Display in Portal
      operationId: get-product-info-by-id
      x-tags:
      - Product
      tags:
      - Leveranciersspecifieke leermiddelencatalogus
      description: Get the product info of a specific product of type digital or combi by id. For a
        product of type physical a 404 Not Found is returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.catalogue
x-tags:
- name: Product
