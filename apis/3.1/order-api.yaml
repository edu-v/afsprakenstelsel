        salesOrderLineId:
          type: string
          description: Optional line number in case of an order with more than one product.
        processedTimestamp:
          type: string
          description: 'The moment that the credit order was processed by the `Ordersysteem leermiddelen`.
            As requests and confirmation messages are send asynchronous, this is not the moment the confirmation
            message was send by the `Ordersysteem leermiddelen` to the `Bestelomgeving leermiddelen`.


