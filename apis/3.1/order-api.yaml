    CreditOrderConfirmation:
      title: CreditOrderConfirmation
      description: "The confirmation that is send back by the `Ordersysteem leermiddelen` as an asynchronous\
        \ reply to the request of the `Bestelomgeving leermiddelen`.\n\nThe `Ordersysteem leermiddelen`\
        \ will send a confirmation message back to the `Bestelomgeving leermiddelen` including a success\
        \ parameter indicating if the `Ordersysteem leermiddelen` approves or declines the credit request.\
        \ In case of a decline, the `Ordersysteem leermiddelen` replies with a functional status code\
        \ and message. \n\nConfirmations are only handled once. If a confirmation with the similar requestReferenceId\
        \ is received the processing is only done the first time. The confirmation may be send multiple\
        \ times, but always with the same responseReferenceId. In this way the `Bestelomgeving leermiddelen`\
        \ can validate that the response is processed only once.\n\nFunctional status codes and messages\
        \ are described in the Documentation.\n"
      type: object
      x-tags:
      - Order
      x-toelichting: Het Ordersysteem leermiddelen reageert op een CreditorderRequest met een bevestigingsbericht
        CreditOrderConfirmation. Indien het CreditorderRequest wordt geaccepteerd door het Ordersysteem
        leermiddelen dan wordt via dit bevestigingsbericht de status OK retour gestuurd. De creditOrderStatus
        wordt in dat geval door het Ordersysteem leermiddelen op approved gezet. Indien de leverancier
        het creditOrderRequest nog verder moet beoordelen kan het Ordersysteem leermiddelen een bevestigingsbericht
        sturen met de status pending.
      properties:
        requestReferenceId:
          type: string
          description: The requestReferenceId that was send by the `Bestelomgeving leermiddelen` as part
            of the CreditOrderRequest request
          format: uuid
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b73
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        responseReferenceId:
          type: string
          description: A reference to this confirmation message send by the `Ordersysteem leermiddelen`
            to the `Bestelomgeving leermiddelen`.
          format: uuid
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b76
