openapi: 3.1.1
info:
  title: Employees API
  version: 1.2.0-rc.1
  description: 'The Employees API is implemented by the `Administratiesysteem onderwijsmedewerker`.


    Employee data is split into the following objects with corresponding attributes:

    - Basic data: identifiers and name

    - Communication: email, phone, and mobile

    - Roles: organisation roles of the employee within the school


    Not all Employee attributes are available to all consuming reference components.

    All objects have a different security scope which allows the `Administratiesysteem onderwijsmedewerker`
    to share the attributes only with the reference components that are allowed to receive the attributes.


    All consuming reference components require consent to request data from the Employees API.

    The Notifications API can be used by consuming reference components to receive notifications about
    new, modified, or deleted entities within the Employees API.


    The Employees API has a scope of primary and secondary education. Vocational education is out of scope.
    For Vocational Education we advise to use the [Open Education API (OOAPI)](https://openonderwijsapi.nl/).'
  x-afkorting: EMP
  x-status: release-candidate
  x-beheer: Werkgroep Doorgifte Administratie
  x-ingangsdatum: '2027-01-14'
  x-gegevensdienst: Onderwijsmedewerker
  x-bron:
  - Administratiesysteem onderwijsmedewerker
  x-afnemers:
  - 'employee.basic/communication: Administratiesysteem onderwijsdeelnemer'
  - 'employee.basic/communication: Bestelomgeving leermiddelen'
  - 'employee.basic/communication: Dienst met SSO'
  - 'employee.basic/communication: Authenticerende Dienst'
  - 'employee.basic/communication: Authenticerende Identity Provider'
  - 'employee.basic/communication: Delegerende Identity Provider'
  - 'employee.roles: nog geen afnemers'
  contact:
    name: Edu-V
    url: www.edu-v.org/afsprakenstelsel
    email: info@edu-v.org
components:
  schemas:
    schemaVersion:
      description: 'Schema version of this API using semantic versioning 2.0.0.

        The API version number is communicated in the header.

        The major version is communicated in the URI.

        For more information see the [Edu-V versioning guidelines](https://edu-v.atlassian.net/wiki/spaces/AFSPRAKENS/pages/9437200/Versiebeheer).

        '
      type: string
      default: 1.2.0-rc.1
    Employee:
      title: Employee
      description: 'The Employee object with its identifiers and name information.


        Based on the scopes additional attributes can be included in this object.


        ### employee.communication

        Communication data of the Employee. For Employees this is the `e-mail` address, `phone` number
        or `mobile` phone number as provided by the School.


        ### employee.roles

        `organisationRoles` of the Employee within the school.

        '
      type: object
      x-tags:
      - Employee
      x-toelichting: Het object Employee beschrijft de identifiers, de namen van de onderwijsmedewerker
        en overige kenmerken. Dit object is beschikbaar vanuit de scope employee.basic.
      properties:
        userMasterIdentifier:
          type: string
          description: 'The primary identifier for a User. For Students the ECK iD is used.

            For Employees this value is always empty: there is currently no primary identifier for Employees,
            only secondary identifiers (userIds) are used.

            '
          x-vullingsregel: 'De werkingsregel is dat de primaire identifier wordt gehanteerd in het object.
            Er is nog geen primaire identifier voor onderwijsmedewerkers: enkel secundaire identifiers
            (userIds) worden gehanteerd.'
        userIds:
          type: array
          description: 'A secondary identifier for a User. This value is used whenever the primary identifier
            is not available.

            For Employees this value is mandatory.

            '
          items:
            type: object
            properties:
              userId:
                type: string
              userIdType:
                type: string
                enum:
                - NEPPI
                - BPI
                - eduID
                - NEPRI
                - ASI
                - eckId
            required:
            - userId
            - userIdType
          x-vullingsregel: Zodra een secundaire identifier voor een uitzonderingssituatie gehanteerd wordt
            dan wordt naast het Id ook het Type gespecificeerd. Zie de pagina Identiteiten voor de toegestane
            secundaire identifiers.
        givenName:
          type: string
        preferredFirstName:
          type: string
        familyName:
          type: string
        familyNamePrefix:
          type: string
        email:
          type: string
          description: E-mail address hosted by school (e.g. L123456@school.nl).
        phone:
          type: string
          description: Phone number as provided by the school.
        mobile:
          type: string
          description: Mobile phone number as provided by the school.
        organisationRoles:
          type: array
          description: The organisation roles the Employee has within the organisation.
          items:
            type: object
            properties:
              organisation:
                $ref: '#/components/schemas/SchoolReference'
              organisationRole:
                type: string
                description: The organisation role the Employee has within the organisation.
                enum:
                - administratief-medewerker
                - applicatiebeheerder
                - begeleider
                - invalkracht
                - ibp-er
                - leermiddelencoordinator
                - leraar
                - mentor
                - onderwijsbestuurder
                - onderwijsdirecteur
                - stagiair
                x-vullingsregel: Er dient één organisatiefunctie gekozen te worden. De organisatiefuncties
                  zijn gebaseerd op de functies zoals beschreven op de pagina Onderwijsorganisaties en
                  actoren.
              beginDate:
                type: string
                description: 'The start date on which the role becomes active (inclusive). Format: YYYY-MM-DD
                  (according to RFC3339).'
                format: date
                example: '2022-07-31'
              endDate:
                type: string
                description: 'The end date on which the role becomes inactive (exclusive). Format: YYYY-MM-DD
                  (according to RFC3339).'
                format: date
                example: '2024-08-31'
            required:
            - organisation
            - organisationRole
            - beginDate
          x-vullingsregel: Organisatiefuncties zijn een optioneel onderdeel van de Employees API. Op basis
            van expliciete behoeften in ketenprocessen kunnen deze functies worden benut.
        alias:
          type: string
          description: 'An additional field to distinct employees on screen who carry the same name.

            '
          format: string
        status:
          type: string
          description: 'The status field gives an indication to Consumers about the status of an object.

            Consumers can delete objects that are flagged `tobedeleted`  as such if they wish.


            The status attribute is based on the [Base Class from OneRoster](https://www.imsglobal.org/sites/default/files/spec/oneroster/v1p2/rostering-informationmodel/OneRosterv1p2RosteringService_InfoModelv1p0.html#Data_Base).

            '
          enum:
          - active
          - tobedeleted
        dateCreated:
          type: string
          description: 'Indicates the date and time the object was first created. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2017-07-21T17:32:28Z'
        dateLastModified:
          type: string
          description: 'Indicates the date and time the object was last modified. Format: Conform openapi
            in ZULU time zoals gespecificeerd in RFC 3339, section 5.6.'
          format: date-time
          example: '2022-08-11T15:31:12Z'
      required:
      - userIds
      - givenName
      - familyName
      - status
      - dateCreated
      - dateLastModified
    UserReference:
      title: UserReference
      type: object
      properties:
        userMasterIdentifier:
          type: string
          description: 'The primary identifier for a User. For Students the ECK iD is used.

            For Employees this value is always empty: there is currently no primary identifier for Employees,
            only secondary identifiers (userIds) are used.

            '
        userIds:
          type: array
          description: 'A secondary identifier for a User. This value is used whenever the primary identifier
            is not available.

            For Employees this value is mandatory.

            '
          items:
            type: object
            properties:
              userId:
                type: string
              userIdType:
                type: string
                enum:
                - NEPPI
                - BPI
                - eduID
                - NEPRI
                - ASI
                - eckId
            required:
            - userId
            - userIdType
      required:
      - userIds
    SchoolReference:
      title: SchoolReference
      description: A reference to a School organisation.
      type: object
      properties:
        organisationMasterIdentifier:
          type: string
          description: 'The primary identifier for a School. For Schools the `OnderwijsaanbiederId` is
            used.

            (exactly one of organisationMasterIdentifier or organisationIds must be present)

            '
          example: 104A158
        organisationIds:
          type: array
          description: 'A secondary identifier for the School. This value is used whenever the primary
            identifier is not available.

            (exactly one of organisationMasterIdentifier or organisationIds must be present)

            '
          items:
            type: object
            properties:
              organisationId:
                type: string
              organisationIdType:
                type: string
                enum:
                - OIE_CODE
                - BP_ID
                - DD_ID
                - AS_ID
                - V_ID
            required:
            - organisationId
            - organisationIdType
      if:
        required:
        - organisationMasterIdentifier
      then:
        not:
          required:
          - organisationIds
      else:
        required:
        - organisationIds
    StatusResponse:
      title: StatusResponse
      description: Functional status code and status message.
      type: object
      properties:
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nEmployees API (20xx):\n  * `2001` - School unknown: De identifier van\
            \ de onderwijsorganisatie is onbekend.\n  * `2005` - Employee unknown: De identifier van de\
            \ onderwijsmedewerker is onbekend.\n  * `2008` - SchoolPeriod unknown: De identifier van de\
            \ schoolperiode is onbekend."
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
      required:
      - status
  responses:
    BadRequest:
      description: Bad Request - schema validation failed, unsupported schemaVersion, or unknown school
        (status 0011 / 0012 / 0023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Unauthorized:
      description: Unauthorized - the supplier is not authorised for the requested scope (status 0021).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Forbidden:
      description: Forbidden - the information object is classification IV and the gegevensdienst has
        not been activated (status 0022).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    NotFound:
      description: Not Found - the endpoint URL is not known.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    MethodNotAllowed:
      description: Method Not Allowed - the request method is not permitted for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    ServerError:
      description: Internal Server Error - general server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/oauth2/token
          refreshUrl: https://api.example.com/oauth2/token
          scopes:
            eduv.employee.basic: a scope that gives access to employee identifiers and name.
            eduv.employee.communication: a scope that gives access to employee communication attributes.
            eduv.employee.roles: a scope that gives access to employee organisation roles attributes.
paths:
  /employees:
    post:
      x-eduv-error-codes:
      - '2001'
      - '2005'
      summary: Search Employee
      x-tags:
      - Employee
      tags:
      - Administratiesysteem onderwijsmedewerker
      operationId: search-employee
      description: Request an Employee object for a specified Employee at a School.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                school:
                  $ref: '#/components/schemas/SchoolReference'
                employee:
                  $ref: '#/components/schemas/UserReference'
              required:
              - school
              - employee
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.employee.basic
        - eduv.employee.communication
        - eduv.employee.roles
  /employees/school:
    parameters:
    - schema:
        type: string
      name: orgMasterId
      in: query
      required: false
      description: 'The organisationMasterIdentifier of the school.

        This parameter is used when the primary identifier for a school (being the `OnderwijsaanbiederId`)
        is available.

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: string
      name: orgId
      in: query
      required: false
      description: 'The organisationIdentifier (secondary identifier) of the school.

        This parameter is used in combination with the orgIdType when the organisationMasterIdentifier
        is not available.

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: string
        example: DD_ID
        enum:
        - OIE_CODE
        - BP_ID
        - DD_ID
        - AS_ID
        - V_ID
      name: orgIdType
      in: query
      required: false
      description: 'The type of the organisationIdentifier.

        This parameter is used in combination with the orgId when the organisationMasterIdentifier is
        not available.

        The following values are supported:

        - `OIE_CODE`: OnderwijsInstellingserkenningcode

        - `BP_ID`: Basispoort-generated identifier for the school

        - `DD_ID`: DigiDeliveryId generated by the Central Registration of Edu-iX

        - `AS_ID`: LAS-generated identifier (LAS-Key) for the school

        - `V_ID`: VestigingsId – BRIN6-format identifier, including dummy locations

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: boolean
      name: filterByOrgId
      in: query
      required: false
      description: 'Controls whether the response is filtered to only include Employees belonging to the

        specific organisation identified by `orgId` and `orgIdType`, or whether all Employees

        of the associated Onderwijsaanbieder are returned.

        - `true`: Only Employees belonging to the specified secondary identifier are returned.

        - `false`: All Employees of the associated Onderwijsaanbieder are returned (to the extent authorisations
        have been configured).

        When omitted, a sector-specific default applies:

        - **PO (primary education):** defaults to `true` – response is filtered to the specified identifier.

        - **VO (secondary education):** defaults to `false` – response covers the full Onderwijsaanbieder
        scope.

        This parameter is only relevant in combination with `orgId` and `orgIdType`.

        When `orgMasterId` is used, this parameter must be absent or `false`.

        It is the responsibility of the consuming party to verify whether the Source supports

        filtering via this parameter before using it.

        '
    - schema:
        type: string
      name: schoolPeriodId
      in: query
      required: false
      description: Optional filter to request all Employee objects within a specified SchoolPeriod and
        its corresponding schoolPeriodId.
    get:
      x-eduv-error-codes:
      - '2001'
      - '2008'
      summary: Get Employees for School
      x-tags:
      - Employee
      tags:
      - Administratiesysteem onderwijsmedewerker
      operationId: get-employees-for-school
      description: Request all Employee objects including basic information (identifiers and names) for
        a specified school.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.employee.basic
        - eduv.employee.communication
        - eduv.employee.roles
x-tags:
- name: Employee
- name: EmployeeCommunication
- name: EmployeeRoles
