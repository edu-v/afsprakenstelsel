      summary: Get Entitlementproducts for User at School
      operationId: get-entitlementproducts-for-user-at-school
      tags:
      - Aanspraakmanager
      x-tags:
      - Entitlement
      description: 'Retrieve a subset of product information of entitlements for a user at a school from
        an `Aanspraakmanager`

        The `Aanspraakmanager` is the provider of this endpoint. The `Leermiddelenportaal` is the targeted
        consumer of this endpoint.

        In practice only entitlement with the entitlementStatus entitled and licensed are requested.


        The `Licentieregistratie` and `Leermiddelenportaal` should give a 405 HTTP status as result when
        called.

        Consent is required for exchange of entitlement information from the ''Aanspraakmanager'' to the
        `Leermiddelenportaal` and the `Leermiddelendashboard`.


        Due to the confidentiality of the eckId and userIds this endpoint has been implemented as a POST
