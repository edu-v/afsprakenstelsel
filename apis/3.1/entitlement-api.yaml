        - eduv.entitlement.portal
      x-eduv-error-codes:
      - '4012'
      - '4013'
      - '4031'
      - '4032'
  /entitlements/school/user:
    parameters:
    - schema:
        type: string
        example: entitled
        enum:
        - created
        - entitled
        - licensed
        - cancelled
        - blocked
      name: status
      in: query
      description: Filter by status
    post:
      summary: Get Entitlements for User at School
      operationId: get-entitlements-for-user-at-school
      tags:
      - Aanspraakmanager
      x-tags:
      - Entitlement
      description: "Retrieve all entitlements for a user at a school from an `Aanspraakmanager`\nThe `Aanspraakmanager`\
        \ is the provider of this endpoint. \n\nThe `Licentieregistratie` and `Leermiddelenportaal` should\
