    EntitlementProduct:
      title: EntitlementProduct
      description: 'This object describes the Product information a `Leermiddelenportaal` can use to display
        accessUrls to a User.

        '
      type: object
      x-tags:
      - Entitlement
      x-toelichting: 'Een Leermiddelenportaal kan bij de Aanspraakmanager de producten opvragen waar een
        eindgebruiker een aanspraak op heeft. Dit object bevat alleen informatie over het product, de
        status van de aanspraak en de datumvelden die van toepassing zijn op de activatie- en gebruiksperiode.

        '
      properties:
        entitlementId:
          type: string
          format: uuid
          example: 24e39454-5360-4ba4-819f-03e59b8dd679
        productId:
          type: string
          description: Unique identifier of a Product. The productId can be retrieved from the Catalogue
            API of supplier of the learning materials.
          x-voorbeeld: '8717927130834'
        entitlementStatus:
          type: string
          description: The status of the entitlement.
          enum:
          - created
          - entitled
          - licensed
          - cancelled
          - blocked
          x-vullingsregel: Status wordt toegekend conform de levenscyclus van de Aanspraak.
        startDate:
          type: string
          description: 'Date from which the product can be activated by the Entitlee(s). The startDate
            marks the start of the activation period.


            Format: YYYY-MM-DD (according to RFC3339).

            '
          format: date
          example: '2021-08-22'
          x-voorbeeld: '2022-08-01'
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        activationUntilDate:
          type: string
          description: 'Date on which the product can no longer be activated by the Entitlee(s).

            The activationUntilDate marks the end of the activation period.

            This does not imply the product can not be used by Licensees who have activated the product
            during the activation period.


            Format: YYYY-MM-DD (according to RFC3339).

            '
          format: date
          example: '2022-07-31'
          x-voorbeeld: '2023-07-31'
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        expirationDate:
          type: string
          description: 'ExpirationDate a `Leermiddelenportaal` can use to maintain access links to the
            Product in the Learning Material Lists of Students or Employees.

            An initially set minExpirationDate is calculated by the `Aanspraakmanager` based on info from
            the Product retrieved from the Catalogue API.


            If the `Aanspraakmanager` receives an InitialActivation message regarding this Entitlement
            from the `Licentieregistratie` via the Usage API, the expirationDate could be updated.

            The InitialActivation message could include an updated expirationDate. In that case this new
            expirationDate overwrites the initially set minExpirationDate.

            This triggers the process within the `Aanspraakmanager` to exchange the updated entitlement
            with the `Leermiddelenportaal`. The `Leermiddelenportaal` reports its urlStatus back via newUrlStatus.


            Format: YYYY-MM-DD (according to RFC3339).

            '
          format: date
          example: '2022-07-31'
          x-voorbeeld: '2023-07-31'
          x-vullingsregel: 'Deze waarde wordt berekend op basis van de informatie over het product uit
            de catalogus. Voor een jaarlicentie is dit bijvoorbeeld 1 jaar na de startDate.

            Dit veld is optioneel. Indien het veld leeg is, is er geen einddatum voor het tonen van de
            toegangslink.

            De Aanspraakmanager kan via een InitialActivation-bericht een nieuwe expirationDate doorkrijgen
            uit de Licentieregistratie. In dat geval wordt het plaatsen van de toegangslink door het Leermiddelenportaal
            opnieuw geïnitieerd door de Aanspraakmanager. Deze nieuwe expirationDate is gelijk aan of
            ligt verder in de toekomst en overschrijft voor de betreffende gebruiker de eerder berekende
            minExpirationDate.

            '
      required:
      - entitlementId
      - productId
      - entitlementStatus
      - startDate
      - activationUntilDate
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/oauth2/token
          refreshUrl: https://api.example.com/oauth2/token
          scopes:
            eduv.entitlement.seller: scope that allows a `Bestelomgeving leermiddelen` to request entitlement
              information.
            eduv.entitlement.licensor: scope needed to send and receive Entitlement requests and Confirmation
              messages to the `Licentieregistratie` and to request entitlement information as a `Licentieregistratie.
            eduv.entitlement.portal: scope needed to send and receive Entitlement requests and Confirmation
              messages to the `Leermiddelenportaal` and to request entitlement information as a `Leermiddelenportaal`.
              to display accessUrls.
            eduv.entitlement.dashboard: scope that allows a `Leermiddelendashboard` to request entitlement
              information.
      description: ''
  responses:
    BadRequest:
      description: Bad Request - schema validation failed, unsupported schemaVersion, or unknown school
        (status 0011 / 0012 / 0023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Unauthorized:
      description: Unauthorized - the supplier is not authorised for the requested scope (status 0021).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Forbidden:
      description: Forbidden - the information object is classification IV and the gegevensdienst has
        not been activated (status 0022).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    NotFound:
      description: Not Found - the endpoint URL is not known.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    ServerError:
      description: Internal Server Error - general server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
paths:
  /entitlements/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: Specific entitlementId of an Entitlement.
    get:
      summary: Get Entitlement
      operationId: get-entitlement
      tags:
      - Aanspraakmanager
      x-tags:
      - Entitlement
      description: 'Retrieve an entitlement by ID from a `Aanspraakmanager`.


        The `Aanspraakmanager` is the provider of this endpoint.

        The `Licentieregistratie` and `Leermiddelenportaal` should give a 405 HTTP status as result when
        called.


        This endpoint can be used by the `Bestelomgeving leermiddelen`, `Licentieregistratie`, and `Leermiddelenportaal`
        for support processes.


        Consent is required for exchange of entitlement information from the ''Aanspraakmanager'' to the
        `Leermiddelenportaal` and the `Leermiddelendashboard`.

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed - Aanspraakmanager is provider of this endpoint
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.entitlement.seller
        - eduv.entitlement.licensor
        - eduv.entitlement.portal
        - eduv.entitlement.dashboard
      x-eduv-error-codes:
      - '4011'
  /entitlements/deliveryorder/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: The deliveryOrderId for which entitlement information is requested.
    get:
      summary: Get Entitlements by DeliveryOrder
      operationId: get-entitlements-by-delivery-order
      tags:
      - Aanspraakmanager
      x-tags:
      - Entitlement
      - DeliveryOrder
      description: 'Retrieve all entitlements for a deliveryOrder from a `Aanspraakmanager`.


        The `Aanspraakmanager` is the provider of this endpoint.

        The `Licentieregistratie` and `Leermiddelenportaal` should give a 405 HTTP status as result when
        called.

        Consent is required for exchange of entitlement information from the ''Aanspraakmanager'' to the
        `Leermiddelenportaal` and the `Leermiddelendashboard`.

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed - Aanspraakmanager is provider of this endpoint
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - OAuth2:
        - eduv.entitlement.seller
        - eduv.entitlement.licensor
        - eduv.entitlement.portal
        - eduv.entitlement.dashboard
      x-eduv-error-codes:
      - '4012'
      - '4013'
  /entitlements/school:
    parameters:
    - schema:
        type: string
      name: orgMasterId
      in: query
      required: false
      description: 'The organisationMasterIdentifier of the school.

        This parameter is used when the primary identifier for a school (being the `OnderwijsaanbiederId`)
        is available.

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: string
      name: orgId
      in: query
      required: false
      description: 'The organisationIdentifier (secondary identifier) of the school.

        This parameter is used in combination with the orgIdType when the organisationMasterIdentifier
        is not available.

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: string
        example: DD_ID
        enum:
        - OIE_CODE
        - BP_ID
        - DD_ID
        - AS_ID
      name: orgIdType
      in: query
      required: false
      description: 'The type of the organisationIdentifier.

        This parameter is used in combination with the orgId when the organisationMasterIdentifier is
        not available.

        '
      x-vullingsregel: Gebruik óf orgMasterId, óf de combinatie orgId + orgIdType, nooit beide in hetzelfde
        request (zie "Organisatie-identiteiten en filtergedrag").
    - schema:
        type: string
      name: deliveryOrderId
      in: query
      description: Filter by deliveryOrderId
