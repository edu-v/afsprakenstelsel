    StatusResponse:
      title: StatusResponse
      description: Functional status code and status message.
      type: object
      properties:
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nEntitlement API (40xx):\n  * `4001` - entitlementReferenceId missing:\
            \ entitlementReferenceId ontbreekt.\n  * `4002` - entitlementReferenceId unknown: Het entitlementReferenceId\
            \ is onbekend.\n  * `4003` - entitlementReferenceId already used: Het entitlementReferenceId\
            \ is al eerder gebruikt.\n  * `4004` - entitlementReceiveId missing: Het entitlementReceiveId\
            \ ontbreekt.\n  * `4005` - entitlementReceiveId already used: Het entitlementReceiveId is\
            \ al eerder gebruikt.\n  * `4011` - entitlementId unknown: Het entitlementId is onbekend.\n\
            \  * `4012` - deliveryOrderId missing: Specificatie van deliveryOrder ontbreekt.\n  * `4013`\
            \ - deliveryOrderId unknown: Het deliveryOrderId is onbekend.\n  * `4021` - productId missing:\
            \ Specificatie van Product ontbreekt.\n  * `4022` - productId unknown: Gespecificeerd Product\
            \ onbekend bij Ontvanger.\n  * `4023` - Product not yet for sale: Gespecificeerd Product is\
            \ nog niet in de verkoop.\n  * `4024` - Product not available: Gespecificeerd Product is niet\
            \ beschikbaar.\n  * `4025` - Product no longer for sale: Gespecificeerd Product is niet langer\
            \ in de verkoop.\n  * `4031` - School missing: Onderwijsorganisatie is niet gespecificeerd.\n\
            \  * `4032` - School unknown: Gespecificeerde Onderwijsorganisatie is niet bekend bij Ontvanger.\n\
            \  * `4033` - User missing: Specificatie van entitlees of activatiecodes niet volledig.\n\
            \  * `4034` - User unknown: Gespecificeerde entitlees zijn niet bekend bij Ontvanger.\n  *\
            \ `4041` - contractId unknown: Gespecificeerd contractId is onbekend bij de ontvangende Licentieregistratie.\n\
            \  * `4042` - Contract restrictions: Bericht niet toegestaan als gevolg van contractuele afspraken\
            \ tussen de leverancier van het leermiddel en de leverancier die de verwerving faciliteert.\n\
            \  * `4051` - startDate before firstPublishedDate: Gespecificeerde startdatum van de activatieperiode\
            \ ligt voor de datum dat het product op de markt verschijnt.\n  * `4061` - Entitlement is\
            \ licensed: Indien een Aanspraakmanager een aanspraak wil annuleren dan mag er geen licentie\
            \ geregistreerd zijn op de aanspraak.\n  * `4071` - activationCode unknown: Gespecificeerde\
            \ activatiecode is onbekend bij de ontvangende Licentieregistratie.\n  * `4072` - activationCode\
            \ already used: Gespecificeerde activatiecode is reeds gebruikt voor een aanspraak.\n  * `4073`\
            \ - activationCode revoked: Gespecificeerde activatiecode is ingetrokken."
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
      required:
      - status
    DeliveryOrderEntitlements:
      title: DeliveryOrderEntitlements
