              required:
              - school
              - user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntitlementProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
