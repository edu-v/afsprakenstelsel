openapi: 3.1.1
info:
  title: ActivationCode API
  version: 0.10.0-rc.1
  description: 'The ActivationCode API is implemented by the reference components `Bestelomgeving leermiddelen`
    and `Licentieregistratie`.


    The `Bestelomgeving leermiddelen` is able to request or revoke an activation code from the `Licentieregistratie`.


    Requests are send and received via asynchronous transactions. Therefore the `Licentieregistratie`
    need to implement endpoints to receive requests. Moreover the `Bestelomgeving leermiddelen` needs
    to implement confirmation endpoints to receive confirmations from the `Licentieregistratie` that requests
    have been processed.'
  x-afkorting: ACT
  x-status: beta-draft
  x-beheer: Werkgroep Verwerven en in gebruik nemen
  x-ingangsdatum: '2027-01-14'
  x-gegevensdienst: Activatiecodeverzoek
  x-bron:
  - Bestelomgeving leermiddelen
  contact:
    name: Edu-V
    url: www.edu-v.org/afsprakenstelsel
    email: info@edu-v.org
components:
  schemas:
    schemaVersion:
      description: 'Schema version of this API using semantic versioning 2.0.0.

        The API version number is communicated in the header.

        The major version is communicated in the URI.

        For more information see the [Edu-V versioning guidelines](https://edu-v.atlassian.net/wiki/spaces/AFSPRAKENS/pages/9437200/Versiebeheer).

        '
      type: string
      default: 0.10.0-rc.1
    ActivationCodeRequest:
      title: ActivationCodeRequest
      description: 'Request send by the `Bestelomgeving leermiddelen` to the `Licentieregistratie` to
        request a specified quantity of activation codes for a single Product. These activation codes
        can be sold by the `Bestelomgeving leermiddelen` and can be used to specify schoolstudent, schoolemployee
        or Personal Entitlements.

        '
      type: object
      x-tags:
      - ActivationCode
      x-toelichting: Het ActivationCodeRequest bericht wordt door de Bestelomgeving leermiddelen verstuurd
        naar de Licentieregistratie binnen de activationcode. In de berichtspecificatie is een requestReferenceId
        opgenomen die wordt bepaald door de verzender. Dit stelt de verzender in staat om bevestigingsberichten
        vanuit de Licentieregistratie terug te relateren aan het verstuurde activationCodeRequest bericht.
        Dit is vergelijkbaar met de uitwisselingsvariant die ook geïmplementeerd is voor aanspraken (Entitlements).
      properties:
        requestReferenceId:
          type: string
          description: 'Unique requestReferenceId for this request. This referenceId is used by the Event
            Mediator of the `Bestelomgeving leermiddelen` to match the ActivationCodeConfirmation confirmation
            message(s) send by the `Licentieregistratie`.

            If a party receives another request with the same requestReferenceId value, the receiving
            party should not process the request again. It should send the confirmation again.

            '
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b73
          x-vullingsregel: Dit nummer wordt gebruikt door de event mediator van de Bestelomgeving leermiddelen
            om een logboek bij te houden van verzonden en ontvangen meldingen en terugmeldingen met betrekking
            tot een unieke aanvraag van een activatiecode.
        productId:
          type: string
          description: The Product for which a `Bestelomgeving leermiddelen` requests (an) activation
            code(s). The productId can be retrieved from the Catalogue API from the supplier of the learning
            material.
          x-voorbeeld: '8717927130834'
          x-vullingsregel: 'Een aanvraag voor een activatiecode verwijst naar exact 1 Product-Beschrijving
            (Leermiddel- of Setbeschrijving)

            Waarde mag niet gewijzigd worden'
        quantity:
          type: integer
          description: Total requested activation codes for the Product.
          example: 1
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        contractId:
          type: string
          description: An optional unique identifier for a contract between the two suppliers where this
            requests belongs to.
          x-voorbeeld: 2022-12-v1
          x-vullingsregel: Waarde mag niet gewijzigd worden.
      required:
      - requestReferenceId
      - productId
      - quantity
    ActivationCodeConfirmation:
      title: ActivationCodeConfirmation
      description: "The confirmation that is send back by the `Licentieregistratie` as an asynchronous\
        \ reply to the request of the `Bestelomgeving leermiddelen`.\nThe `Licentieregistratie` includes\
        \ in the confirmation message the requested activation codes. In case the `Licentieregistratie`\
        \ cannot generate these codes a functional status code and message is replied. \nConfirmations\
        \ are only handled once. If a confirmation with the similar requestReferenceId is received the\
        \ processing is only done the first time. The confirmation may be send multiple times, but always\
        \ with the same responseReferenceId. In this way the `Bestelomgeving leermiddelen` can validate\
        \ that the confirmation is processed only once.\n\nFunctional status codes and messages are described\
        \ in the Documentation.\n"
      type: object
      x-tags:
      - ActivationCode
      x-toelichting: De Licentieregistratie reageert op een ActivationCodeRequest bericht met een ActivationCodeConfirmation
        bevestigingsbericht. In dit bevestigingsbericht worden de activatiecodes opgenomen. In aanvulling
        hierop wordt optioneel de informatie uit de aanvraag (product, contractId) ook bevestigd. Door
        ook een tijdstempel op te nemen kan dit bevestigingsbericht worden gezien als een formele levering
        van activatiecodes van aan de Bestelomgeving leermiddelen.
      properties:
        requestReferenceId:
          type: string
          description: The requestReferenceId that was send by the `Bestelomgeving leermiddelen` as part
            of the ActivationCodeRequest event
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b73
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        responseReferenceId:
          type: string
          description: A reference to this confirmation message send by the `Licentieregistratie`.
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b76
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        productId:
          type: string
          description: The productId which was part of the ActivationCodeRequest Event send by the `Bestelomgeving
            leermiddelen`. The activation codes give Students or Employees the possibility to activate
            this Product.
          x-voorbeeld: '8717927130834'
          x-vullingsregel: Waarde mag gewijzigd worden.
        activationCodes:
          type: array
          description: 'List of activation codes which can be used to activate the Product.

            '
          items:
            type: string
            description: Activation code which can be used to activate the Product
          x-voorbeeld: '[XXXXXX, YYYYYY, ZZZZZZ]'
          x-vullingsregel: 'Waarde wordt gevuld indien het verzoek succesvol is verwerkt

            Waarde mag niet gewijzigd worden.'
        processedTimestamp:
          type: string
          description: 'The moment that the activation codes were generated by the `Licentieregistratie`
            and the request was processed. As Events and confirmation messages are send asynchronous,
            this is not the moment the confirmation message was send by the `Licentieregistratie` to the
            `Bestelomgeving leermiddelen`.


            Format: Conform openapi in ZULU time as specified in RFC 3339, section 5.6

            '
          format: date-time
          example: '2017-07-21T17:32:28Z'
          x-vullingsregel: Het tijdstip kan afwijken van het versturen van het bevestigingsbericht. Intentie
            is om aan te geven wanneer het bericht is verwerkt.
        success:
          type: boolean
          description: 'Boolean indicating the ActivationCodeRequest event was processed successfully.

            When the `Licentieregistratie` disagrees with the request a false will be returned, along
            with a status code and a status message.

            '
          x-vullingsregel: False indien de Licentieregistratie niet akkoord is of er een fout is opgetreden.
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nActivationCode API (50xx):\n  * `5001` - requestReferenceId unknown:\
            \ requestReferenceId onbekend\n  * `5002` - requestReferenceId already used: requestReferenceId\
            \ is al eerder gebruikt.\n  * `5003` - responseReferenceId unknown: responseReferenceId onbekend\n\
            \  * `5004` - responseReferenceId already used: responseReferenceId is al eerder gebruikt.\n\
            \  * `5011` - activationCode unknown: Activatiecode is onbekend\n  * `5021` - productId missing:\
            \ Specificatie van Product ontbreekt\n  * `5022` - productId unknown: Gespecificeerd Product\
            \ onbekend bij Ontvanger\n  * `5023` - Product not yet for sale: Gespecificeerd Product is\
            \ nog niet in de verkoop\n  * `5024` - Product not available: Gespecificeerd Product is niet\
            \ beschikbaar.\n  * `5025` - Product no longer for sale: Gespecificeerd Product is niet langer\
            \ in de verkoop\n  * `5026` - Product does not support activation codes: Gespecificeerd Product\
            \ kan niet worden verkocht middels een activatiecode.\n  * `5041` - contractId unknown: Gespecificeerd\
            \ contractId is onbekend bij de ontvangende Licentieregistratie\n  * `5042` - Contract restrictions:\
            \ Bericht niet toegestaan als gevolg van contractuele afspraken tussen de leverancier van\
            \ het leermiddel en de leverancier die de verwerving faciliteert.\n  * `5051` - License registered\
            \ on activationCode: Het annuleren van een activatiecode is niet mogelijk zodra het leermiddel\
            \ in gebruik is genomen."
          x-voorbeeld: 0
          x-vullingsregel: Zie status en foutcodes
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
          x-vullingsregel: Zie status en foutcodes
      required:
      - requestReferenceId
      - responseReferenceId
      - productId
      - processedTimestamp
      - success
      - status
      if:
        properties:
          success:
            const: true
        required:
        - success
      then:
        required:
        - activationCodes
    ActivationCodeRevokeRequest:
      title: ActivationCodeRevokeRequest
      description: 'Request send by the `Bestelomgeving leermiddelen` to the `Licentieregistratie` with
        a request to revoke an activation code. After the revoke, the activation code cannot be used to
        activate a Product.

        '
      type: object
      x-tags:
      - ActivationCode
      x-toelichting: 'Naast een regulier verzoek om een activatiecode is het mogelijk om om een activatiecode
        in te laten trekken. Ook dit bericht wordt verstuurd binnen de scope activationcode. In dat geval
        dient de Bestelomgeving leermiddelen een ActivationCodeRevokeRequest in bij de Licentieregistratie.


        In dit bericht wordt de activatiecode en optioneel het responseReferenceId ontvangen van de Aanbieder
        gespecificeerd. Op deze wijze kunnen zowel Bestelomgeving leermiddelen als Licentieregistratie
        dit bericht relateren aan de oorspronkelijke aanvraag voor de activatiecode die ingetrokken dient
        te worden. Uiteraard is het afhankelijk van bilaterale afspraken tussen leveranciers of het intrekken
        van een activatiecode al dan niet mogelijk is.'
      properties:
        requestReferenceId:
          type: string
          description: 'Unique requestReferenceId for this request. This referenceId is used by the Event
            Mediator of the `Bestelomgeving leermiddelen` to match the ActivationCodeRevokeConfirmation
            confirmation message(s) send by the `Licentieregistratie`.

            If a party receives another request with the same requestReferenceId value, the receiving
            party should not process the request again. It should send the confirmation again.

            '
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b73
          x-vullingsregel: Dit nummer wordt gebruikt door de event mediator van de Bestelomgeving leermiddelen
            of de Licentieregistratie om een logboek bij te houden van verzonden en ontvangen meldingen
            en terugmeldingen met betrekking tot een unieke aanvraag van een activatiecode.
        activationCode:
          type: string
          description: Activation code which should be revoked by the `Licentieregistratie`.
          x-voorbeeld: XXXXXX
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        responseReferenceId:
          type: string
          description: Optional reference to the responseReferenceID of the confirmation message in which
            the `Licentieregistratie` send the activation code to the `Bestelomgeving leermiddelen`.
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b76
          x-vullingsregel: Waarde mag niet gewijzigd worden
      required:
      - requestReferenceId
      - activationCode
    ActivationCodeRevokeConfirmation:
      title: ActivationCodeRevokeConfirmation
      description: "The confirmation that is send back by the `Licentieregistratie` as an asynchronous\
        \ reply to the request of the `Bestelomgeving leermiddelen`.\nThe `Licentieregistratie` will send\
        \ a confirmation message back to the `Bestelomgeving leermiddelen` including a success parameter\
        \ indicating if the revoke has been processed successfully. In case the revoke was not processed,\
        \ the `Licentieregistratie` replies with a functional status code and message. \nConfirmations\
        \ are only handled once. If a confirmation with the similar requestReferenceId is received the\
        \ processing is only done the first time. The confirmation may be send multiple times, but always\
        \ with the same responseReferenceId. In this way the `Bestelomgeving leermiddelen` can validate\
        \ that the response is processed only once.\n\nFunctional status codes and messages are described\
        \ in the Documentation.\n"
      type: object
      x-tags:
      - ActivationCode
      x-toelichting: De Licentieregistratie reageert op een ActivationCodeRevokeRequest met een bevestigingsbericht
        ActivationCodeRevokeConfirmation.
      properties:
        requestReferenceId:
          type: string
          description: The requestReferenceId that was send by the `Bestelomgeving leermiddelen` as part
            of the ActivationCodeRequest event
          x-voorbeeld: eacb81ef-c9d5-4bd8-a624-4088bee04b73
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        responseReferenceId:
          type: string
          description: A reference to this confirmation message send by the `Licentieregistratie` to the
            `Bestelomgeving leermiddelen`.
          x-voorbeeld: 24e39454-5360-4ba4-819f-03e59b8dd679
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        activationCode:
          type: string
          description: The activation code which was part of the ActivationCodeRevokeRequest Event send
            by the `Bestelomgeving leermiddelen`.
          x-voorbeeld: XXXXX-XXXXX-XXXXX-XXXXX-XXXXX
          x-vullingsregel: Waarde mag niet gewijzigd worden.
        processedTimestamp:
          type: string
          description: 'The moment that the activation codes were revoked by the `Licentieregistratie`
            and the request was processed. As Events and confirmation messages are send asynchronous,
            this is not the moment the confirmation message was send by the `Licentieregistratie` to the
            `Bestelomgeving leermiddelen`.


            Format: Conform openapi in ZULU time as specified in RFC 3339, section 5.6

            '
          format: date-time
          example: '2017-07-21T17:32:28Z'
          x-vullingsregel: Het tijdstip kan afwijken van het versturen van het bevestigingsbericht. Intentie
            is om aan te geven wanneer het bericht is verwerkt.
        success:
          type: boolean
          description: 'Boolean indicating the ActivationCodeRevokeRequest event was processed successfully.

            When the `Licentieregistratie` disagrees with the request a false will be returned, along
            with a status code and a status message.

            '
          x-vullingsregel: False indien de Ontvanger niet akkoord is of er een fout is opgetreden.
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nActivationCode API (50xx):\n  * `5001` - requestReferenceId unknown:\
            \ requestReferenceId onbekend\n  * `5002` - requestReferenceId already used: requestReferenceId\
            \ is al eerder gebruikt.\n  * `5003` - responseReferenceId unknown: responseReferenceId onbekend\n\
            \  * `5004` - responseReferenceId already used: responseReferenceId is al eerder gebruikt.\n\
            \  * `5011` - activationCode unknown: Activatiecode is onbekend\n  * `5021` - productId missing:\
            \ Specificatie van Product ontbreekt\n  * `5022` - productId unknown: Gespecificeerd Product\
            \ onbekend bij Ontvanger\n  * `5023` - Product not yet for sale: Gespecificeerd Product is\
            \ nog niet in de verkoop\n  * `5024` - Product not available: Gespecificeerd Product is niet\
            \ beschikbaar.\n  * `5025` - Product no longer for sale: Gespecificeerd Product is niet langer\
            \ in de verkoop\n  * `5026` - Product does not support activation codes: Gespecificeerd Product\
            \ kan niet worden verkocht middels een activatiecode.\n  * `5041` - contractId unknown: Gespecificeerd\
            \ contractId is onbekend bij de ontvangende Licentieregistratie\n  * `5042` - Contract restrictions:\
            \ Bericht niet toegestaan als gevolg van contractuele afspraken tussen de leverancier van\
            \ het leermiddel en de leverancier die de verwerving faciliteert.\n  * `5051` - License registered\
            \ on activationCode: Het annuleren van een activatiecode is niet mogelijk zodra het leermiddel\
            \ in gebruik is genomen."
          x-voorbeeld: 0
          x-vullingsregel: Zie status en foutcodes
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
          x-vullingsregel: Zie status en foutcodes
      required:
      - requestReferenceId
      - responseReferenceId
      - activationCode
      - processedTimestamp
      - success
      - status
    StatusResponse:
      title: StatusResponse
      description: Functional status code and status message.
      type: object
      properties:
        status:
          type: integer
          description: "Functional status code, as defined in \"Status- en foutcodes 1.0.0\".\nCodes are sent as integers without\
            \ leading zeros (0011 = 11).\n\nAlgemeen (00xx) - applies to every\
            \ API:\n  * `0000` - OK: Bevraging succesvol (HTTP 200).\n  * `0001` - Created: Bericht heeft\
            \ geleid tot registratie van een nieuwe entiteit (HTTP 201).\n  * `0002` - Accepted: Bericht\
            \ geaccepteerd (HTTP 202).\n  * `0011` - Schema incorrect: Schemavalidatie niet succesvol\
            \ (HTTP 400).\n  * `0012` - schemaVersion not supported: De ontvanger kan de gehanteerde schemaVersion\
            \ niet verwerken (HTTP 400).\n  * `0021` - scope required: Leverancier is niet geautoriseerd\
            \ voor scope (HTTP 401).\n  * `0022` - consent required: Informatieobject van classificatie\
            \ IV zonder geactiveerde gegevensdienst (HTTP 403).\n  * `0023` - school unknown: De client\
            \ communiceert in de context van een Onderwijsorganisatie die niet bekend is bij de server\
            \ (HTTP 400).\n  * `0099` - Overige reden: Vullingsregel: neem in statusMessage een beschrijving\
            \ van de reden op.\n\nActivationCode API (50xx):\n  * `5001` - requestReferenceId unknown:\
            \ requestReferenceId onbekend\n  * `5002` - requestReferenceId already used: requestReferenceId\
            \ is al eerder gebruikt.\n  * `5003` - responseReferenceId unknown: responseReferenceId onbekend\n\
            \  * `5004` - responseReferenceId already used: responseReferenceId is al eerder gebruikt.\n\
            \  * `5011` - activationCode unknown: Activatiecode is onbekend\n  * `5021` - productId missing:\
            \ Specificatie van Product ontbreekt\n  * `5022` - productId unknown: Gespecificeerd Product\
            \ onbekend bij Ontvanger\n  * `5023` - Product not yet for sale: Gespecificeerd Product is\
            \ nog niet in de verkoop\n  * `5024` - Product not available: Gespecificeerd Product is niet\
            \ beschikbaar.\n  * `5025` - Product no longer for sale: Gespecificeerd Product is niet langer\
            \ in de verkoop\n  * `5026` - Product does not support activation codes: Gespecificeerd Product\
            \ kan niet worden verkocht middels een activatiecode.\n  * `5041` - contractId unknown: Gespecificeerd\
            \ contractId is onbekend bij de ontvangende Licentieregistratie\n  * `5042` - Contract restrictions:\
            \ Bericht niet toegestaan als gevolg van contractuele afspraken tussen de leverancier van\
            \ het leermiddel en de leverancier die de verwerving faciliteert.\n  * `5051` - License registered\
            \ on activationCode: Het annuleren van een activatiecode is niet mogelijk zodra het leermiddel\
            \ in gebruik is genomen."
        statusMessage:
          type: string
          description: See functional status messages within the Documentation.
      required:
      - status
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/oauth2/token
          refreshUrl: https://api.example.com/oauth2/token
          scopes:
            eduv.activationcode: scope needed to send and receive ActivationCode Events and Confirmation
              messages.
      description: ''
  responses:
    BadRequest:
      description: Bad Request - schema validation failed, unsupported schemaVersion, or unknown school
        (status 0011 / 0012 / 0023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Unauthorized:
      description: Unauthorized - the supplier is not authorised for the requested scope (status 0021).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Forbidden:
      description: Forbidden - the information object is classification IV and the gegevensdienst has
        not been activated (status 0022).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    ServerError:
      description: Internal Server Error - general server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
paths:
  /activationcodes:
    put:
      summary: Accept activation code request
      operationId: accept-activation-code-request
      tags:
      - Licentieregistratie
      x-tags:
      - ActivationCode
      description: 'As a `Bestelomgeving leermiddelen` request an activation code from the `Licentieregistratie`.


        The `Licentieregistratie` is the provider of this endpoint.

        The `Bestelomgeving leermiddelen` should give a 405 HTTP status as result when called.'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Method Not Allowed - Licentieregistratie is provider of this endpoint
        '500':
          $ref: '#/components/responses/ServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCodeRequest'
      security:
      - OAuth2:
        - eduv.activationcode
  /activationcodes/revoke:
    put:
      summary: Accept activation code revoke request
      operationId: accept-activation-code-revoke-request
      tags:
      - Licentieregistratie
      x-tags:
      - ActivationCode
      description: 'As a `Bestelomgeving leermiddelen` request the `Licentieregistratie` to revoke an
        activation code.


        The `Licentieregistratie` is the provider of this endpoint.

        The `Bestelomgeving leermiddelen` should give a 405 HTTP status as result when called.'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
